# tryrepio.com → the same wallet-loyalty app on :3002
#
# A second name for the app that already answers to loyalty.iprep.ca. Nothing
# moves and nothing restarts: nginx routes by the name in the request, so one
# machine serves iprep.ca, loyalty.iprep.ca and this from three server blocks
# that share nothing.
#
# loyalty.iprep.ca deliberately keeps working. Anything already printed or
# already in someone's phone points at it, and a QR code on a counter cannot
# be edited. tryrepio.com is the canonical name from here on — that is set by
# NEXT_PUBLIC_APP_URL in .env, which is what new counter stands are drawn
# with.
#
# Install:
#   sudo cp ~/wallet-loyalty/deploy/nginx-tryrepio.conf \
#           /etc/nginx/sites-available/tryrepio
#   sudo ln -sf /etc/nginx/sites-available/tryrepio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tryrepio.com -d www.tryrepio.com
#
# The upstream is declared in nginx-loyalty.conf and is global, so it is not
# repeated here — two upstreams of the same name would refuse to load.

# www → the bare name, once, with a redirect rather than a second copy of the
# site. Two addresses serving identical pages is two addresses to keep in step
# and splits whatever reputation the domain earns.
server {
  server_name www.tryrepio.com;
  listen 80;
  return 301 https://tryrepio.com$request_uri;
}

server {
  server_name tryrepio.com;
  # Must stay above the app's own upload limit (MAX_UPLOAD_BYTES, 25MB) with
  # room for multipart overhead. nginx rejects an oversized body with a bare
  # 413 before the request reaches the app, so a mismatch here looks to the
  # owner like the upload silently failing — which is exactly how it was
  # found: the code accepted a 12MB photo and nginx had already refused it.
  client_max_body_size 30M;

  # Card artwork. Immutable and safe to cache hard at the edge — every input
  # that changes a pixel is already in the path.
  location /api/strip/ {
    proxy_pass http://loyalty_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_valid 200 365d;
  }

  # Apple's PassKit web service. Apple's servers call this directly, so it can
  # never sit behind a login. It authenticates itself with the per-pass token.
  location /api/apple/ {
    proxy_pass http://loyalty_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Everything else: join pages, scanner, dashboard, the rest of the API.
  location / {
    proxy_pass http://loyalty_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
  }

  listen 80;
  # certbot adds the listen 443 / ssl_certificate lines on first run:
  #   sudo certbot --nginx -d tryrepio.com -d www.tryrepio.com
}
