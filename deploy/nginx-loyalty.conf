# loyalty.iprep.ca → wallet-loyalty Node app on :3002
#
# Lives alongside the iPrep site on the same box. Separate app, separate
# database, separate pm2 process — they share nothing but the machine.
#
# No edge auth here, unlike iprep.ca. Three of these routes MUST stay open:
#   /j/*          the customer join page — scanned from a shop counter
#   /api/strip/*  card artwork, fetched by Apple and Google
#   /api/apple/*  Apple's servers call this to check whether a card changed
# The dashboard and scanner are gated inside the app instead (owner login,
# staff PIN), which is where that logic belongs.

upstream loyalty_app {
  server 127.0.0.1:3002;
  keepalive 16;
}

server {
  server_name loyalty.iprep.ca;
  # Must stay above the app's own upload limit (MAX_UPLOAD_BYTES, 25MB) with
  # room for multipart overhead. nginx rejects an oversized body with a bare
  # 413 before the request reaches the app, so a mismatch here looks to the
  # owner like the upload silently failing — which is exactly how it was
  # found: the code accepted a 12MB photo and nginx had already refused it.
  client_max_body_size 30M;

  # Card artwork. Immutable and safe to cache hard at the edge — every input
  # that changes a pixel is already in the path.
  location /api/strip/ {
    proxy_pass http://loyalty_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_valid 200 365d;
  }

  # Apple's PassKit web service. Apple's servers call this directly, so it can
  # never sit behind a login. It authenticates itself with the per-pass token.
  location /api/apple/ {
    proxy_pass http://loyalty_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Everything else: join pages, scanner, dashboard, the rest of the API.
  location / {
    proxy_pass http://loyalty_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
  }

  listen 80;
  # certbot adds the listen 443 / ssl_certificate lines on first run:
  #   sudo certbot --nginx -d loyalty.iprep.ca
}
